title: glosse.me
tagline: eliana's corner of the web
description: glosse.me — eliana's corner of the web.
url: https://glosse.me
lang: en
author: eliana

# Used by jekyll-seo-tag for the structured data search engines read.
social:
  name: eliana
  links:
    - https://github.com/jubilancy
    - https://bsky.app/profile/basedgirl.bsky.social

# Accounts the live pages read from (exposed to the browser as window.GLOSSE).
github_user: jubilancy
github_repo: jubilancy/glosse.me
bluesky: basedgirl.bsky.social

favicon: https://64.media.tumblr.com/d5ec28e365635b96f197feebc5393d35/89ea4a76136154b1-f3/s250x400/e5ab5e57bc4c5bea4fb5d3f656518f5943662c0b.gif

permalink: pretty
# Folders of markdown become sections automatically (see README, "Adding content").
auto_nav: true        # new sections appear in the header; false = terminal only
sections_ignore: []   # top-level folders to never treat as sections

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - .bundle

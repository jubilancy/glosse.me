<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/gif" href="{{ site.favicon }}">
{% seo %}
{% if site.sections_feed %}<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml" />
{% endif %}<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
<script>window.GLOSSE = { github: {{ site.github_user | jsonify }}, repo: {{ site.github_repo | jsonify }}, bluesky: {{ site.bluesky | jsonify }} };</script>
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</head>

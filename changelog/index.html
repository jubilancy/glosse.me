<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>changelog | glosse.me</title>
<meta name="description" content="Recent commits to glosse.me, pulled live from GitHub." />
<meta property="og:title" content="changelog | glosse.me" />
<meta property="og:description" content="Recent commits to glosse.me, pulled live from GitHub." />
<meta property="og:url" content="https://glosse.me/changelog/" />
<link rel="stylesheet" href="/styles.css" />
<script src="/site.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="site-title" href="/">glosse.me</a>
      <nav>
        <a href="/projects/">projects</a>
        <a href="/stats/">stats</a>
        <a href="/notes/">notes</a>
        <a href="/changelog/" aria-current="page">changelog</a>
        <a href="/about/">about</a>
        <a href="/contact/">contact</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark">◐</button>
      </nav>
    </header>

    <main>
      <h1 class="page-title">changelog</h1>
      <p class="lede">
        Every commit to this site, newest first, pulled live from
        <a href="https://github.com/jubilancy/glosse.me">github.com/jubilancy/glosse.me</a>.
        No manual writing required — push a commit and it shows up here.
      </p>

      <section>
        <div class="section-heading">
          <span id="commitCount">commits</span>
          <a href="https://github.com/jubilancy/glosse.me/commits/main">on github ↗</a>
        </div>
        <ul class="repo-list" id="commitList">
          <li class="state">Loading commits…</li>
        </ul>
        <div style="margin-top:1.25rem">
          <button id="loadMore" class="theme-toggle" style="width:auto;padding:0.45rem 0.9rem;height:auto;display:none">
            load more
          </button>
        </div>
      </section>
    </main>
  </div>

  <footer>
    <span>© <span id="year"></span> glosse.me</span>
    <span><a href="https://github.com/jubilancy">github</a> · <a href="https://bsky.app/profile/basedgirl.bsky.social">bluesky</a></span>
  </footer>

  <script>
  var REPO = 'jubilancy/glosse.me';
  var API = 'https://api.github.com/repos/' + REPO + '/commits';
  var page = 1;
  var total = 0;
  var PER_PAGE = 25;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function dayLabel(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function renderCommit(item) {
    var msg = item.commit.message.split('\n');
    var title = msg[0];
    var body = msg.slice(1).join('\n').trim();
    var authorName = item.commit.author ? item.commit.author.name : 'unknown';
    var shortSha = item.sha.slice(0, 7);

    return '<li class="repo">' +
      '<div class="repo-head">' +
        '<a class="repo-name" href="' + item.html_url + '">' + escapeHtml(title) + '</a>' +
        '<span class="repo-updated">' + timeAgo(item.commit.author.date) + '</span>' +
      '</div>' +
      (body ? '<p class="repo-desc">' + escapeHtml(body) + '</p>' : '') +
      '<div class="repo-meta">' +
        '<span>' + escapeHtml(authorName) + '</span>' +
        '<span>' + dayLabel(item.commit.author.date) + '</span>' +
        '<span><a href="' + item.html_url + '" style="color:inherit">' + shortSha + '</a></span>' +
      '</div>' +
    '</li>';
  }

  function load(append) {
    var url = API + '?sha=main&per_page=' + PER_PAGE + '&page=' + page;

    return fetch(url)
      .then(function (r) {
        if (r.status === 403) throw new Error('rate-limited');
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (commits) {
        var list = document.getElementById('commitList');
        if (!append) list.innerHTML = '';

        if (!commits.length && !total) {
          list.innerHTML = '<li class="state">No commits yet.</li>';
          return;
        }

        list.insertAdjacentHTML('beforeend', commits.map(renderCommit).join(''));
        total += commits.length;
        document.getElementById('commitCount').textContent = total + ' commits';
        document.getElementById('loadMore').style.display =
          commits.length === PER_PAGE ? 'block' : 'none';
      })
      .catch(function (err) {
        if (!append) {
          var msg = err.message === 'rate-limited'
            ? 'GitHub is rate-limiting this network right now. Try again in a few minutes, or '
            : 'Couldn\'t reach GitHub. ';
          document.getElementById('commitList').innerHTML =
            '<li class="state">' + msg +
            '<a href="https://github.com/' + REPO + '/commits/main">view commits on GitHub</a>.</li>';
        }
      });
  }

  document.getElementById('loadMore').addEventListener('click', function () {
    page += 1;
    load(true);
  });

  load(false);
  </script>
</body>
</html>

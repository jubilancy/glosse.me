<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>glosse.me — webgarden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Victor+Mono:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:     #f5f0e8;
      --cream-2:   #ede5d5;
      --sage:      #7a9e7e;
      --sage-d:    #5c7a60;
      --ink:       #2a2318;
      --ink-mid:   #5a4f3e;
      --ink-light: #8a7d6a;
      --rust:      #b05a3a;
      --border:    #c5b89a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cream:     #1c1f1a;
        --cream-2:   #252921;
        --sage:      #7aaa7e;
        --sage-d:    #5c8a60;
        --ink:       #ddd5c0;
        --ink-mid:   #a89d88;
        --ink-light: #6a6050;
        --rust:      #c97050;
        --border:    #3a4035;
      }
    }

    html, body {
      width: 250px;
      height: 250px;
      overflow: hidden;
      background: var(--cream);
      font-family: 'Victor Mono', 'Courier New', monospace;
      color: var(--ink);
    }

    .pot {
      width: 250px;
      height: 250px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    /* top bar */
    .top {
      background: var(--cream-2);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px 7px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-shrink: 0;
    }

    .wordmark {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--sage);
      letter-spacing: 0.03em;
      text-decoration: none;
    }

    .wordmark span { color: var(--rust); }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border);
      margin: 0 2px 1px;
      display: inline-block;
      vertical-align: middle;
    }

    /* body */
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 12px 10px;
      gap: 10px;
      overflow: hidden;
    }

    /* little leaf illustration */
    .illustration {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    /* nav links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .links a {
      font-size: 0.68rem;
      color: var(--ink-mid);
      text-decoration: none;
      padding: 2px 6px;
      border-left: 2px solid transparent;
      display: block;
      transition: color 0.1s, border-color 0.1s;
    }

    .links a:hover {
      color: var(--sage);
      border-left-color: var(--sage);
    }

    .link-section {
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-light);
      padding: 4px 6px 1px;
      display: block;
    }

    /* bottom bar */
    .bottom {
      background: var(--cream-2);
      border-top: 1px solid var(--border);
      padding: 5px 12px;
      font-size: 0.6rem;
      color: var(--ink-light);
      font-style: italic;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bottom .stats {
      display: flex;
      gap: 8px;
    }

    .bottom .stats span strong {
      color: var(--sage);
      font-style: normal;
    }
  </style>
</head>
<body>
<div class="pot">

  <div class="top">
    <a href="https://glosse.me/" class="wordmark" target="_blank">glosse<span>.</span>me</a>
    <span class="dot"></span>
    <span style="font-size:0.6rem; color:var(--ink-light); font-style:italic;">eliana's corner</span>
  </div>

  <div class="body">

    <div class="illustration">
      <svg width="80" height="54" viewBox="0 0 80 54" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- stem -->
        <line x1="40" y1="54" x2="40" y2="20" stroke="#7a9e7e" stroke-width="1.5" stroke-linecap="round"/>
        <!-- left leaf -->
        <path d="M40 32 C28 26 18 28 20 38 C22 46 36 42 40 36" fill="#c8dcc9" stroke="#7a9e7e" stroke-width="1"/>
        <!-- right leaf -->
        <path d="M40 24 C52 18 62 20 60 30 C58 38 44 34 40 28" fill="#c8dcc9" stroke="#7a9e7e" stroke-width="1"/>
        <!-- small bud -->
        <ellipse cx="40" cy="17" rx="5" ry="7" fill="#b05a3a" opacity="0.7"/>
        <ellipse cx="40" cy="13" rx="3" ry="4" fill="#b05a3a"/>
        <!-- soil line -->
        <line x1="26" y1="54" x2="54" y2="54" stroke="#c5b89a" stroke-width="1.5" stroke-linecap="round"/>
        <!-- pot -->
        <path d="M28 54 L24 48 L56 48 L52 54" fill="#ede5d5" stroke="#c5b89a" stroke-width="1"/>
        <ellipse cx="40" cy="48" rx="16" ry="2" fill="#c5b89a" opacity="0.4"/>
      </svg>
    </div>

    <div class="links">
      <span class="link-section">writing</span>
      <a href="https://glosse.me/notes/" target="_blank">notes</a>
      <a href="https://glosse.me/about/" target="_blank">about</a>
      <span class="link-section">stuff</span>
      <a href="https://glosse.me/projects/" target="_blank">projects</a>
      <a href="https://glosse.me/greenhouse/" target="_blank">greenhouse</a>
    </div>

  </div>

  <div class="bottom">
    <span>a small corner of the web</span>
  </div>

</div>
</body>
</html>
